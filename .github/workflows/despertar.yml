# Mantiene despierto el servidor gratuito de Render (se duerme tras 15 min sin visitas),
# para que el agente opere 24/7. Solo hace una visita ligera cada 10 minutos.
name: Mantener despierto el servidor
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar el servidor
        run: |
          for i in 1 2 3; do
            curl -fsS -m 60 https://autokill.onrender.com/agent/health && exit 0
            sleep 20
          done
          curl -fsS -m 90 https://autokill.onrender.com/ || true
