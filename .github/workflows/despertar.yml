# Mantiene despierto el servidor gratuito de Render (se duerme tras 15 min sin visitas),
# para que el agente opere 24/7. Solo hace una visita ligera cada 30 minutos (con el repositorio privado, así no se pasa de los 2.000 minutos gratis al mes de GitHub; el propio servidor además se visita cada 9 min).
name: Mantener despierto el servidor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar el servidor
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 60 https://autokill.onrender.com/agent/health; then echo; curl -sS -m 30 -o /dev/null -w "tiempo de respuesta de la app: %{time_total} s\n" https://autokill.onrender.com/agent/health; curl -sS -m 30 https://autokill.onrender.com/ || true; exit 0; fi
            sleep 20
          done
          curl -fsS -m 90 https://autokill.onrender.com/ || true
